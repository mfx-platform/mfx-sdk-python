# Every push and pull request: formatting, lint, strict types and the full test suite on Linux,
# Windows and macOS, the generated client checked against the API description, and nothing
# internal in what would be published.
#
# Actions are pinned to a full commit SHA, with the release it is in the trailing comment, so a
# moved tag cannot change what runs here. Dependabot proposes the updates.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install from the lock file
        run: uv sync --locked
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint, including a docstring on every public name
        run: uv run ruff check .
      - name: Strict types
        run: uv run mypy src
      - name: Tests, with 100% line coverage
        run: uv run pytest

  generated:
    name: generated client matches the API description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Regenerate src/mfx/_generated from spec/openapi.yaml
        run: uv run python tools/generate.py
      - name: Nothing differs from what is committed
        run: |
          if ! git diff --quiet -- src/mfx/_generated; then
            echo "::error::src/mfx/_generated differs from what the generator produces."
            echo "It is never edited by hand: run uv run python tools/generate.py"
            git diff --stat -- src/mfx/_generated
            exit 1
          fi

  package:
    name: package builds and publishes nothing internal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: The repository
        run: uv run --no-project python tools/check_public.py --tree .
      - name: Build the wheel and the source distribution
        run: uv build
      - name: The wheel, the source distribution and the documents
        run: uv run --no-project python tools/check_public.py dist
